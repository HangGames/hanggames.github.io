name: Hourly Selective Footer Tag Injection

on:
  schedule:
    - cron: '0 * * * *' # Triggers automatically at the start of every hour
  workflow_dispatch:      # Provides a manual "Run workflow" button in GitHub

jobs:
  inject-custom-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_FOOTER_TOKEN }} # Bypasses organization restrictions

      - name: Fetch Remote Links
        id: fetch_data
        run: |
          REMOTE_DATA=$(curl -s "https://gist.githubusercontent.com/raw/04f6645a22d39e92114a9270920e3f4b/gist.txt")
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo "$REMOTE_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build New HTML Links Snippet
        run: |
          > temp_anchors.txt
          while IFS= read -r line; do
            if [ ! -z "$line" ] && [ ! -z "${line//[[:space:]]/}" ]; then
              clean_line=$(echo "$line" | tr -d '\r')
              
              if [[ "$clean_line" == *"|"* ]]; then
                url=$(echo "$clean_line" | cut -d'|' -f1 | xargs)
                text=$(echo "$clean_line" | cut -d'|' -f2 | xargs)
              else
                url=$(echo "$clean_line" | xargs)
                text="$url"
              fi
              
              echo "  <a href=\"$url\">$text</a>" >> temp_anchors.txt
            fi
          done <<< "${{ steps.fetch_data.outputs.data }}"

      - name: Process Custom Tag Replacement
        shell: python
        run: |
          import os
          import re

          # 1. Read the newly generated link anchor lines
          with open("temp_anchors.txt", "r", encoding="utf-8") as f:
              new_links = f.read().strip()

          # Define our custom element wrappers
          open_tag = "<custom-links>"
          close_tag = "</custom-links>"
          fresh_payload = f"{open_tag}\n{new_links}\n{close_tag}"

          # Regex to find an existing <custom-links> element and everything inside it
          custom_tag_pattern = re.compile(r"<custom-links>.*?</custom-links>", re.DOTALL)

          # 2. Walk through every folder to find your HTML files
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".html") and file != "temp_anchors.txt":
                      file_path = os.path.join(root, file)
                      
                      with open(file_path, "r", encoding="utf-8") as f:
                          file_content = f.read()
                      
                      # STATE A: The custom element already exists (Run 2 onwards)
                      if open_tag in file_content and close_tag in file_content:
                          updated_html = custom_tag_pattern.sub(fresh_payload, file_content)
                      
                      # STATE B: First time run - Inject right before </footer>
                      elif "</footer>" in file_content:
                          first_run_injection = f"{fresh_payload}</footer>"
                          # We replace only the final occurrence or a clean string swap
                          updated_html = file_content.replace("</footer>", first_run_injection)
                      
                      else:
                          continue # Skip file if it doesn't contain a footer
                      
                      with open(file_path, "w", encoding="utf-8") as f:
                          f.write(updated_html)
                          
          print("Targeted custom tag updates completed across all pages.")

      - name: Clean Up Temp File
        run: rm temp_anchors.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          if git diff --staged --quiet; then
            echo "The text file contents match current state. Skipping push."
          else
            git commit -m "chore: hourly dynamic custom-links injection"
            git push
          fi
